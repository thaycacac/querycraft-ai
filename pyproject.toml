[project]
name = "querycraft"
version = "0.1.0"
description = "Agentic Text-to-SQL with a semantic/metric layer for user-behavior event data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
app = ["streamlit>=1.38"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
